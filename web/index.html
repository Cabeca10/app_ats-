<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Base href for Flutter Web.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pmach ATS Digital - Sistema PWA de Gestão e Atendimento Técnico Industrial">

  <!-- Mobile Viewport & PWA Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A369D">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pmach ATS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pmach ATS Digital</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A369D;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Gerenciador do evento nativo de instalação do PWA (beforeinstallprompt)
    window.pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(event) {
      // Previne o prompt padrão imediato e guarda para disparo controlado
      event.preventDefault();
      window.pwaInstallPrompt = event;
      window.dispatchEvent(new Event('pwa-prompt-ready'));
      console.log('[PWA] Evento beforeinstallprompt capturado com sucesso.');
    });

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] Pmach ATS Digital instalado como aplicativo standalone.');
      window.pwaInstallPrompt = null;
    });

    // Função utilitária para acionar o prompt nativo de instalação
    window.promptPwaInstallation = function() {
      if (window.pwaInstallPrompt) {
        window.pwaInstallPrompt.prompt();
        window.pwaInstallPrompt.userChoice.then(function(choiceResult) {
          console.log('[PWA] Escolha do usuário:', choiceResult.outcome);
          window.pwaInstallPrompt = null;
        });
      } else {
        console.log('[PWA] O prompt de instalação não está disponível no momento.');
      }
    };
  </script>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 500; letter-spacing: 0.5px;">Carregando Pmach ATS...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
