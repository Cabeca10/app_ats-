<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Base href for Flutter Web.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pmach ATS Digital - Sistema PWA de Gestão e Atendimento Técnico Industrial">

  <!-- Mobile Viewport & PWA Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A369D">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pmach ATS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=4">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=4"/>
  <link rel="shortcut icon" href="favicon.ico?v=4"/>

  <title>Pmach ATS Digital</title>
  <link rel="manifest" href="manifest.json?v=4">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A369D;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Remove Service Workers antigos e caches do Flutter que poderiam reter versão/orientação antiga
    (function () {
      try {
        if ('caches' in window) {
          caches.keys().then(function (names) {
            names
              .filter(function (name) {
                return name.indexOf('flutter-') === 0 || name.indexOf('workbox-') === 0;
              })
              .forEach(function (name) {
                caches.delete(name);
              });
          }).catch(function () {});
        }
        if ('serviceWorker' in navigator) {
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            if (!registrations || registrations.length === 0) return;
            Promise.all(registrations.map(function (reg) {
              return reg.unregister();
            })).then(function (results) {
              var anyUnregistered = results.some(Boolean);
              if ((hadController || anyUnregistered) && !sessionStorage.getItem('pmach_sw_cleared_v2')) {
                sessionStorage.setItem('pmach_sw_cleared_v2', '1');
                window.location.reload();
              }
            }).catch(function () {});
          }).catch(function () {});
        }
      } catch (_) {}
    })();

    // Libera a rotação para retrato e paisagem caso o navegador tenha bloqueio anterior
    try {
      if (window.screen && window.screen.orientation && typeof window.screen.orientation.unlock === 'function') {
        window.screen.orientation.unlock();
      }
    } catch (_) {}

    // Detecta se o app está aberto já instalado como aplicativo standalone
    window.isRunningStandalone = function() {
      try {
        var standaloneMatch = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
        return Boolean(standaloneMatch || window.navigator.standalone === true);
      } catch (_) {
        return false;
      }
    };

    // Solicita orientação ao navegador (quando suportado pelo contexto)
    window.requestBrowserOrientation = function(mode) {
      try {
        if (!window.screen || !window.screen.orientation) return;
        if (mode === 'any') {
          if (typeof window.screen.orientation.unlock === 'function') {
            window.screen.orientation.unlock();
          }
        } else if (typeof window.screen.orientation.lock === 'function') {
          var lockPromise = window.screen.orientation.lock(mode);
          if (lockPromise && typeof lockPromise.catch === 'function') {
            lockPromise.catch(function() {});
          }
        }
      } catch (_) {}
    };

    // Gerenciador do evento nativo de instalação do PWA (beforeinstallprompt)
    window.pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(event) {
      // Previne o prompt padrão imediato e guarda para disparo controlado
      event.preventDefault();
      window.pwaInstallPrompt = event;
      window.dispatchEvent(new Event('pwa-prompt-ready'));
      console.log('[PWA] Evento beforeinstallprompt capturado com sucesso.');
    });

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] Pmach ATS Digital instalado como aplicativo standalone.');
      window.pwaInstallPrompt = null;
    });

    // Função utilitária para acionar o prompt nativo de instalação
    window.promptPwaInstallation = function() {
      if (window.pwaInstallPrompt) {
        try {
          window.pwaInstallPrompt.prompt();
          window.pwaInstallPrompt.userChoice.then(function(choiceResult) {
            console.log('[PWA] Escolha do usuário:', choiceResult.outcome);
            window.pwaInstallPrompt = null;
          });
          return true;
        } catch (_) {
          return false;
        }
      } else {
        console.log('[PWA] O prompt de instalação não está disponível no momento.');
        return false;
      }
    };
  </script>
</head>
<body>
  <div id="loading-indicator">
    <div style="background: #ffffff; padding: 12px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); margin-bottom: 18px;">
      <img src="icons/Icon-192.png?v=4" alt="Pmach ATS" style="width: 72px; height: 72px; display: block; border-radius: 12px;" />
    </div>
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 500; letter-spacing: 0.5px;">Carregando Pmach ATS...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
